<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COA & Master Data | PT ERAPEE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="text-gray-800 bg-gray-50">
    <div class="flex h-screen overflow-hidden">
        <!-- SIDEBAR -->
        <div id="sidebar-container"></div>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col overflow-y-auto md:ml-64">
            <div id="header-container"></div>

            <main class="p-4 md:p-8 max-w-7xl mx-auto w-full">
                <!-- Tombol Aksi -->
                <div class="mb-6 flex flex-wrap justify-between items-center gap-4">
                    <div>
                        <h2 class="text-xl font-bold text-gray-800">Manajemen Bagan Akun (COA) & Master Data</h2>
                        <p class="text-xs text-gray-500 mt-0.5">Sinkronisasi data standar perusahaan dengan Cloud Firestore</p>
                    </div>
                    <div class="flex gap-3">
                        <button onclick="seedDefaultCOA()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium px-4 py-2.5 rounded-xl transition shadow-sm">
                            📥 Muat Default COA Google Sheet
                        </button>
                        <button onclick="bukaModalTambah()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-4 py-2.5 rounded-xl transition shadow-sm">
                            + Tambah Akun Baru
                        </button>
                    </div>
                </div>

                <!-- Tabel COA Interaktif -->
                <div class="dashboard-card p-6 bg-white rounded-2xl shadow-sm">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm border-collapse">
                            <thead>
                                <tr class="bg-gray-50 text-gray-500 text-xs uppercase border-b">
                                    <th class="p-4">Kode Akun</th>
                                    <th class="p-4">Nama Akun</th>
                                    <th class="p-4">Saldo Normal</th>
                                    <th class="p-4">Kelompok</th>
                                    <th class="p-4">Pos Laporan</th>
                                    <th class="p-4 text-center">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="tabelCOA" class="divide-y divide-gray-100">
                                <tr>
                                    <td colspan="6" class="p-8 text-center text-gray-400">Menghubungkan ke Firebase Firestore...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Modal Tambah/Edit COA -->
    <div id="modalCOA" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl">
            <h3 id="modalTitle" class="text-lg font-bold mb-4 text-gray-800">Tambah Akun COA</h3>
            <form id="formCOA" class="space-y-4">
                <input type="hidden" id="editDocId">
                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">Kode Akun</label>
                    <input type="text" id="kodeAkun" placeholder="Contoh: 1104" class="form-input-custom font-mono" required>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">Nama Akun</label>
                    <input type="text" id="namaAkun" placeholder="Contoh: Kas Kecil Cabang" class="form-input-custom" required>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">Saldo Normal</label>
                        <select id="saldoNormal" class="form-input-custom">
                            <option value="Debit">Debit</option>
                            <option value="Kredit">Kredit</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">Kelompok</label>
                        <select id="kelompokAkun" class="form-input-custom">
                            <option value="Aset">Aset</option>
                            <option value="Liabilitas">Liabilitas</option>
                            <option value="Ekuitas">Ekuitas</option>
                            <option value="Pendapatan">Pendapatan</option>
                            <option value="Beban">Beban</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">Pos Laporan</label>
                    <input type="text" id="posLaporan" placeholder="Kas dan setara kas / Laba Rugi" class="form-input-custom" required>
                </div>
                <div class="flex justify-end space-x-3 pt-4 border-t">
                    <button type="button" onclick="tutupModal()" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-sm rounded-xl font-medium">Batal</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm rounded-xl font-medium">Simpan Data</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Skrip Firebase CRUD & Seeder -->
    <script type="module">
        import { CONFIG, db } from "./js/config.js";
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { collection, getDocs, addDoc, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const COLLECTION_COA = "master_coa";

        // Daftar default COA utama dari Google Sheet PT Erapee
        const DEFAULT_COA_DATA = [
            { kode: "1101", nama: "Kas", saldoNormal: "Debit", kelompok: "Aset", posLaporan: "Kas dan setara kas" },
            { kode: "1102", nama: "Bank operasional", saldoNormal: "Debit", kelompok: "Aset", posLaporan: "Kas dan setara kas" },
            { kode: "1103", nama: "Dompet elektronik/payment gateway", saldoNormal: "Debit", kelompok: "Aset", posLaporan: "Kas dan setara kas" },
            { kode: "1201", nama: "Piutang usaha", saldoNormal: "Debit", kelompok: "Aset", posLaporan: "Piutang usaha" },
            { kode: "3101", nama: "Modal saham", saldoNormal: "Kredit", kelompok: "Ekuitas", posLaporan: "Ekuitas pemegang saham" },
            { kode: "4101", nama: "SaaS dan lisensi perangkat lunak", saldoNormal: "Kredit", kelompok: "Pendapatan", posLaporan: "Laba Rugi" },
            { kode: "4102", nama: "Pendapatan budidaya pertanian", saldoNormal: "Kredit", kelompok: "Pendapatan", posLaporan: "Laba Rugi" },
            { kode: "5101", nama: "Beban gaji & tunjangan", saldoNormal: "Debit", kelompok: "Beban", posLaporan: "Laba Rugi" },
            { kode: "5102", nama: "Beban sewa & utilitas", saldoNormal: "Debit", kelompok: "Beban", posLaporan: "Laba Rugi" }
        ];

        window.muatDataCOA = async function() {
            const tbody = document.getElementById('tabelCOA');
            tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-gray-400">Memuat data COA dari Firebase...</td></tr>`;

            try {
                const querySnapshot = await getDocs(collection(db, COLLECTION_COA));
                tbody.innerHTML = '';

                if (querySnapshot.empty) {
                    tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-gray-400">Belum ada data COA. Klik tombol <b>"Muat Default COA Google Sheet"</b> di atas untuk mengisi data otomatis.</td></tr>`;
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    let tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="p-4 font-mono font-semibold text-indigo-600">${data.kode || '-'}</td>
                        <td class="p-4 font-medium text-gray-800">${data.nama || '-'}</td>
                        <td class="p-4 text-gray-600">${data.saldoNormal || '-'}</td>
                        <td class="p-4 text-gray-600">${data.kelompok || '-'}</td>
                        <td class="p-4 text-gray-600">${data.posLaporan || '-'}</td>
                        <td class="p-4 text-center space-x-2 whitespace-nowrap">
                            <button onclick='bukaModalEdit("${docSnap.id}", ${JSON.stringify(data).replace(/'/g, "&#39;")})' class="text-indigo-600 hover:underline text-xs font-semibold">Edit</button>
                            <button onclick='hapusCOA("${docSnap.id}", "${data.kode}")' class="text-red-600 hover:underline text-xs font-semibold">Hapus</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error("Gagal memuat COA:", err);
                tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-red-500">Gagal terhubung ke database.</td></tr>`;
            }
        };

        window.seedDefaultCOA = async function() {
            if (confirm("Apakah Anda ingin memasukkan data default COA Google Sheet ke Firestore?")) {
                try {
                    for (let item of DEFAULT_COA_DATA) {
                        await addDoc(collection(db, COLLECTION_COA), item);
                    }
                    alert("Berhasil memuat data default COA!");
                    muatDataCOA();
                } catch (error) {
                    console.error("Gagal seeding:", error);
                    alert("Terjadi kesalahan saat memuat data default.");
                }
            }
        };

        window.bukaModalTambah = function() {
            document.getElementById('modalTitle').innerText = "Tambah Akun COA Baru";
            document.getElementById('editDocId').value = "";
            document.getElementById('kodeAkun').value = "";
            document.getElementById('namaAkun').value = "";
            document.getElementById('posLaporan').value = "";
            document.getElementById('modalCOA').classList.remove('hidden');
        };

        window.bukaModalEdit = function(id, data) {
            document.getElementById('modalTitle').innerText = "Edit Akun COA";
            document.getElementById('editDocId').value = id;
            document.getElementById('kodeAkun').value = data.kode || "";
            document.getElementById('namaAkun').value = data.nama || "";
            document.getElementById('saldoNormal').value = data.saldoNormal || "Debit";
            document.getElementById('kelompokAkun').value = data.kelompok || "Aset";
            document.getElementById('posLaporan').value = data.posLaporan || "";
            document.getElementById('modalCOA').classList.remove('hidden');
        };

        window.tutupModal = function() {
            document.getElementById('modalCOA').classList.add('hidden');
        };

        document.getElementById('formCOA').addEventListener('submit', async function(e) {
            e.preventDefault();
            const id = document.getElementById('editDocId').value;
            const newData = {
                kode: document.getElementById('kodeAkun').value,
                nama: document.getElementById('namaAkun').value,
                saldoNormal: document.getElementById('saldoNormal').value,
                kelompok: document.getElementById('kelompokAkun').value,
                posLaporan: document.getElementById('posLaporan').value
            };

            try {
                if (id) {
                    await updateDoc(doc(db, COLLECTION_COA, id), newData);
                    alert("Akun COA berhasil diperbarui!");
                } else {
                    await addDoc(collection(db, COLLECTION_COA), newData);
                    alert("Akun COA baru berhasil ditambahkan!");
                }
                tutupModal();
                muatDataCOA();
            } catch (error) {
                console.error("Gagal menyimpan COA:", error);
                alert("Terjadi kesalahan saat menyimpan data.");
            }
        });

        window.hapusCOA = async function(id, kode) {
            if (confirm(`Apakah Anda yakin ingin menghapus akun COA [${kode}]?`)) {
                try {
                    await deleteDoc(doc(db, COLLECTION_COA, id));
                    alert("Akun COA berhasil dihapus!");
                    muatDataCOA();
                } catch (error) {
                    console.error("Gagal menghapus:", error);
                    alert("Gagal menghapus data.");
                }
            }
        };

        muatDataCOA();
    </script>
    <script type="module" src="js/component.js"></script>
</body>
</html>
