<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengaturan Branding & Logo | PT ERAPEE Anugrah Sejahtera</title>
    <!-- Inisialisasi tema (terpusat di js/tema-*.js, lihat komentar di file
         tersebut - supaya perubahan logika tema cukup di satu tempat) -->
    <script src="js/tema-fouc-init.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/tema-tailwind-config.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <style>body.auth-pending { visibility: hidden; }</style>
    <!-- Favicon Dinamis akan dimuat oleh skrip -->
    <link id="dynamic-favicon" rel="icon" type="image/png" href="/favicon.png">
</head>
<body data-tema="elegant" class="text-stone-900 dark:text-stone-100 bg-stone-50 dark:bg-stone-950 auth-pending">
    <div class="flex h-screen overflow-hidden">
        <!-- SIDEBAR -->
        <div id="sidebar-container"></div>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col min-h-0 overflow-y-auto md:ml-64">
            <div id="header-container"></div>

            <main class="p-4 md:p-8 max-w-4xl mx-auto w-full">
                <!-- Header (polos di atas latar, tanpa bingkai kartu) -->
                <div class="mb-6">
                    <h1 class="h-elegant-2 text-stone-900 dark:text-stone-50">Pengaturan Identitas & Branding Perusahaan</h1>
                    <p class="text-sm text-stone-500 dark:text-stone-400 mt-1">Sesuaikan Logo Sidebar dan Favicon Tab Browser secara dinamis.</p>
                </div>

                <!-- Form Pengaturan -->
                <div class="bg-white dark:bg-stone-900 border border-stone-200/70 dark:border-stone-800 rounded-2xl p-6 shadow-sm">
                    <div id="notifikasiBranding" class="hidden mb-5 p-3 text-xs rounded-xl font-medium border text-center"></div>

                    <form id="formBranding" class="space-y-6">
                        <!-- Preview & Upload Logo Utama -->
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 items-center border-b border-stone-100 dark:border-stone-800 pb-6">
                            <div>
                                <label class="block text-xs font-bold text-stone-700 dark:text-stone-300 uppercase">Logo Utama (Sidebar)</label>
                                <p class="text-[11px] text-stone-400 dark:text-stone-500 mt-1">Format rekomendasi: PNG transparan (Landscape).</p>
                            </div>
                            <div class="flex justify-center">
                                <img id="previewLogo" src="" alt="Preview Logo" class="h-12 object-contain bg-stone-50 dark:bg-stone-800/60 p-2 rounded-xl border border-dashed border-stone-300 dark:border-stone-700 w-full max-w-[200px]">
                            </div>
                            <div>
                                <input type="file" id="inputFileLogo" accept="image/png, image/jpeg, image/svg+xml" class="form-input-elegant text-xs file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-stone-100 file:text-stone-700 hover:file:bg-stone-200 dark:file:bg-stone-800 dark:file:text-stone-300 dark:hover:file:bg-stone-700 cursor-pointer">
                            </div>
                        </div>

                        <!-- Preview & Upload Favicon -->
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 items-center pt-2">
                            <div>
                                <label class="block text-xs font-bold text-stone-700 dark:text-stone-300 uppercase">Favicon (Ikon Browser)</label>
                                <p class="text-[11px] text-stone-400 dark:text-stone-500 mt-1">Format rekomendasi: PNG Kotak (1:1), ukuran 64x64px.</p>
                            </div>
                            <div class="flex justify-center">
                                <img id="previewFavicon" src="" alt="Preview Favicon" class="h-10 w-10 object-contain bg-stone-50 dark:bg-stone-800/60 p-1.5 rounded-xl border border-dashed border-stone-300 dark:border-stone-700">
                            </div>
                            <div>
                                <input type="file" id="inputFileFavicon" accept="image/png, image/x-icon" class="form-input-elegant text-xs file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-stone-100 file:text-stone-700 hover:file:bg-stone-200 dark:file:bg-stone-800 dark:file:text-stone-300 dark:hover:file:bg-stone-700 cursor-pointer">
                            </div>
                        </div>

                        <div class="pt-4 border-t border-stone-100 dark:border-stone-800 flex justify-end">
                            <button type="submit" id="btnSimpanBranding" class="btn-elegant-primary">
                                Simpan & Terapkan Perubahan
                            </button>
                        </div>
                    </form>
                </div>
            </main>
        </div>
    </div>

    <script type="module" src="js/branding-page.js"></script>
    <script type="module" src="js/component.js"></script>
</body>
</html>
