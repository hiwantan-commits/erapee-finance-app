<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Jurnal | PT ERAPEE Anugrah Sejahtera</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="text-gray-800 bg-gray-50">
    <div class="flex h-screen overflow-hidden">
        <!-- SIDEBAR -->
        <div id="sidebar-container"></div>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col overflow-y-auto md:ml-64">
            <div id="header-container"></div>

            <main class="p-4 md:p-8 max-w-5xl mx-auto w-full">
                <div class="dashboard-card p-6 md:p-8 bg-white rounded-2xl shadow-sm">
                    <div class="mb-6 pb-4 border-b border-gray-100">
                        <h2 class="text-lg font-bold text-gray-800">Formulir Input Jurnal Akuntansi</h2>
                        <p class="text-xs text-gray-500 mt-0.5">Pencatatan terintegrasi dengan Firebase Firestore & Standar Coretax</p>
                    </div>

                    <form id="formJurnal" class="space-y-6">
                        <!-- Bagian 1: Identitas Dokumen -->
                        <div>
                            <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">1. Identitas & Referensi Dokumen</h3>
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                                <div>
                                    <label class="block text-xs font-medium mb-1 text-gray-700">ID Jurnal</label>
                                    <input type="text" id="id_jurnal" value="JRN-2026-001" class="form-input-custom font-mono text-xs bg-gray-50" readonly>
                                </div>
                                <div>
                                    <label class="block text-xs font-medium mb-1 text-gray-700">Tanggal Transaksi</label>
                                    <input type="date" id="tanggal" class="form-input-custom" required>
                                </div>
                                <div>
                                    <label class="block text-xs font-medium mb-1 text-gray-700">No. Bukti / Invoice</label>
                                    <input type="text" id="no_bukti" placeholder="INV-2026-001" class="form-input-custom" required>
                                </div>
                            </div>
                        </div>

                        <!-- Bagian 2: Klasifikasi Usaha & Unit (Dinamis dari Firestore) -->
                        <div>
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                                <div>
                                    <label class="block text-xs font-medium mb-1 text-gray-700">Jenis Dokumen</label>
                                    <select id="jenis_dokumen" class="form-input-custom">
                                        <option value="Invoice Penjualan">Invoice Penjualan</option>
                                        <option value="Faktur Pembelian">Faktur Pembelian</option>
                                        <option value="Kas/Bank Masuk">Kas/Bank Masuk</option>
                                        <option value="Kas/Bank Keluar">Kas/Bank Keluar</option>
                                        <option value="Jurnal Umum">Jurnal Umum / Memorial</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xs font-medium mb-1 text-gray-700">Unit Usaha / Sektor (Master Data)</label>
                                    <select id="unit_usaha" class="form-input-custom">
                                        <option value="">Memuat unit usaha...</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xs font-medium mb-1 text-gray-700">Proyek / Komoditas</label>
                                    <input type="text" id="proyek" placeholder="Contoh: Panen Nanas Musim 1" class="form-input-custom">
                                </div>
                            </div>
                        </div>

                        <!-- Bagian 3: Lawan Transaksi & Akun Double-Entry -->
                        <div class="pt-4 border-t border-gray-100">
                            <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">2. Akun & Nilai Jurnal (Double-Entry)</h3>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                                <div>
                                    <label class="block text-xs font-medium mb-1 text-gray-700">Lawan Transaksi (Klien/Vendor)</label>
                                    <input type="text" id="lawan_transaksi" placeholder="PT Mitra Sejahtera / Toko Tani" class="form-input-custom" required>
                                </div>
                                <div>
                                    <label class="block text-xs font-medium mb-1 text-gray-700">NPWP / NIK Lawan Transaksi</label>
                                    <input type="text" id="npwp_nik" placeholder="00.000.000.0-000.000 atau NIK" class="form-input-custom">
                                </div>
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                                <div>
                                    <label class="block text-xs font-medium mb-1 text-gray-700">Kode Akun (COA)</label>
                                    <select id="kode_akun" class="form-input-custom">
                                        <option value="">Memuat akun...</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xs font-medium mb-1 text-gray-700">Kategori Arus Kas</label>
                                    <select id="kategori_arus_kas" class="form-input-custom">
                                        <option value="Operasi">Operasi</option>
                                        <option value="Investasi">Investasi</option>
                                        <option value="Pendanaan">Pendanaan</option>
                                        <option value="Nonkas">Nonkas</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xs font-medium mb-1 text-gray-700">Debit (Rp)</label>
                                    <input type="number" id="debit" value="0" class="form-input-custom font-semibold text-green-700">
                                </div>
                                <div>
                                    <label class="block text-xs font-medium mb-1 text-gray-700">Kredit (Rp)</label>
                                    <input type="number" id="kredit" value="0" class="form-input-custom font-semibold text-red-700">
                                </div>
                            </div>
                        </div>

                        <!-- Bagian 4: Elemen Pajak Terpadu -->
                        <div class="pt-4 border-t border-gray-100">
                            <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">3. Rincian Pajak (PPN & PPh)</h3>
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                                <div>
                                    <label class="block text-xs font-medium mb-1 text-gray-700">DPP Penjualan</label>
                                    <input type="number" id="dpp_penjualan" value="0" class="form-input-custom">
                                </div>
                                <div>
                                    <label class="block text-xs font-medium mb-1 text-gray-700">PPN Keluaran</label>
                                    <input type="number" id="ppn_keluaran" value="0" class="form-input-custom">
                                </div>
                                <div>
                                    <label class="block text-xs font-medium mb-1 text-gray-700">PPh Dipotong PT</label>
                                    <input type="number" id="pph_dipotong" value="0" class="form-input-custom">
                                </div>
                                <div>
                                    <label class="block text-xs font-medium mb-1 text-gray-700">Kode Pajak Ref</label>
                                    <select id="kode_pajak" class="form-input-custom">
                                        <option value="NON">NON (Tanpa Pajak)</option>
                                        <option value="PPN-KEL-11">PPN-KEL-11 (Keluaran 11%)</option>
                                        <option value="PPN-KEL-12">PPN-KEL-12 (Keluaran 12%)</option>
                                        <option value="PPN-MAS-KREDIT">PPN-MAS-KREDIT (Masukan)</option>
                                        <option value="PPN-MAS-NK">PPN-MAS-NK (Masukan Nonkredit)</option>
                                        <option value="PPH21">PPH21 (PPh Pasal 21)</option>
                                        <option value="PPH23-2">PPH23-2 (PPh Pasal 23 - 2%)</option>
                                        <option value="PPH4-2-SEWA10">PPH4-2-SEWA (Final 10%)</option>
                                        <option value="PPH22">PPH22 (PPh Pasal 22)</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- Bagian 5: Keterangan -->
                        <div class="pt-4 border-t border-gray-100">
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                                <div class="md:col-span-2">
                                    <label class="block text-xs font-medium mb-1 text-gray-700">Keterangan / Uraian Jurnal</label>
                                    <textarea id="keterangan" rows="3" placeholder="Penjelasan lengkap transaksi..." class="form-input-custom resize-y" required></textarea>
                                </div>
                                <div>
                                    <label class="block text-xs font-medium mb-1 text-gray-700">Status Jurnal</label>
                                    <select id="status_jurnal" class="form-input-custom font-bold text-indigo-600">
                                        <option value="POSTED">POSTED (Resmi Masuk Buku)</option>
                                        <option value="DRAFT">DRAFT (Belum Diposting)</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- Tombol Submit -->
                        <div class="pt-4">
                            <button type="submit" id="btnSubmit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 px-4 rounded-lg shadow-sm transition duration-200">
                                Simpan Jurnal ke Firebase Firestore
                            </button>
                        </div>
                        <div id="alertSuccess" class="hidden mt-4 p-3 bg-green-50 text-green-700 rounded-lg text-sm text-center font-medium">
                            ✓ Jurnal akuntansi berhasil disimpan ke Cloud database!
                        </div>
                    </form>
                </div>
            </main>
        </div>
    </div>

    <!-- Skrip Firebase & Load Dinamis Unit Usaha + COA -->
    <script type="module">
        import { CONFIG, db } from "./js/config.js";
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Muat Dropdown Unit Usaha dari Firestore (Master Unit Usaha)
        async function muatDropdownUnitUsaha() {
            const selectUnit = document.getElementById('unit_usaha');
            try {
                const snap = await getDocs(collection(db, "master_unit_usaha"));
                if (snap.empty) {
                    selectUnit.innerHTML = '<option value="">(Unit Usaha kosong, harap muat di Master Data)</option>';
                    return;
                }
                let units = [];
                snap.forEach(d => units.push(d.data()));
                units.sort((a, b) => a.kode.localeCompare(b.kode));

                selectUnit.innerHTML = '';
                units.forEach(u => {
                    const opt = document.createElement('option');
                    opt.value = `${u.kode} - ${u.nama}`;
                    opt.text = `${u.kode} - ${u.nama} (${u.kbli})`;
                    selectUnit.appendChild(opt);
                });
            } catch (err) {
                console.error("Gagal memuat unit usaha:", err);
                selectUnit.innerHTML = '<option value="">Gagal memuat unit usaha</option>';
            }
        }

        // Muat Dropdown COA dari Firestore
        async function muatDropdownCOA() {
            const selectCOA = document.getElementById('kode_akun');
            try {
                const querySnapshot = await getDocs(collection(db, "master_coa"));
                if (querySnapshot.empty) {
                    selectCOA.innerHTML = '<option value="">(COA Kosong)</option>';
                    return;
                }
                let coaList = [];
                querySnapshot.forEach(doc => coaList.push(doc.data()));
                coaList.sort((a, b) => a.kode.localeCompare(b.kode));

                selectCOA.innerHTML = '';
                coaList.forEach(coa => {
                    const opt = document.createElement('option');
                    opt.value = coa.kode; 
                    opt.text = `${coa.kode} - ${coa.nama}`;
                    selectCOA.appendChild(opt);
                });
            } catch (error) {
                console.error("Gagal memuat COA:", error);
                selectCOA.innerHTML = '<option value="">Gagal memuat akun</option>';
            }
        }

        muatDropdownUnitUsaha();
        muatDropdownCOA();

        const formJurnal = document.getElementById('formJurnal');
        formJurnal.addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            btn.innerText = "Menyimpan ke Cloud...";
            btn.disabled = true;

            try {
                const selectCOA = document.getElementById('kode_akun');
                const namaAkunLengkap = selectCOA.options[selectCOA.selectedIndex]?.text || '';

                const dataJurnal = {
                    id_jurnal: document.getElementById('id_jurnal').value,
                    tanggal: document.getElementById('tanggal').value,
                    no_bukti: document.getElementById('no_bukti').value,
                    jenis_dokumen: document.getElementById('jenis_dokumen').value,
                    unit_usaha: document.getElementById('unit_usaha').value,
                    proyek: document.getElementById('proyek').value,
                    lawan_transaksi: document.getElementById('lawan_transaksi').value,
                    npwp_nik: document.getElementById('npwp_nik').value,
                    kode_akun: document.getElementById('kode_akun').value,
                    nama_akun: namaAkunLengkap,
                    kategori_arus_kas: document.getElementById('kategori_arus_kas').value,
                    debit: parseFloat(document.getElementById('debit').value) || 0,
                    kredit: parseFloat(document.getElementById('kredit').value) || 0,
                    dpp_penjualan: parseFloat(document.getElementById('dpp_penjualan').value) || 0,
                    ppn_keluaran: parseFloat(document.getElementById('ppn_keluaran').value) || 0,
                    pph_dipotong: parseFloat(document.getElementById('pph_dipotong').value) || 0,
                    kode_pajak: document.getElementById('kode_pajak').value,
                    keterangan: document.getElementById('keterangan').value,
                    status: document.getElementById('status_jurnal').value,
                    timestamp: new Date()
                };

                await addDoc(collection(db, CONFIG.COLLECTION_NAME), dataJurnal);
                document.getElementById('alertSuccess').classList.remove('hidden');
                formJurnal.reset();
                muatDropdownUnitUsaha();
                muatDropdownCOA();
                setTimeout(() => document.getElementById('alertSuccess').classList.add('hidden'), 5000);
            } catch (error) {
                console.error("Gagal menyimpan:", error);
                alert("Terjadi kesalahan saat menyimpan ke database.");
            } finally {
                btn.innerText = "Simpan Jurnal ke Firebase Firestore";
                btn.disabled = false;
            }
        });
    </script>
    <script type="module" src="js/component.js"></script>
</body>
</html>
