<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Jurnal - PT ERAPEE</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tom Select CSS & JS untuk Searchable Dropdown -->
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.complete.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50 flex h-screen overflow-hidden font-sans">

    <!-- Komponen Sidebar Kiri -->
    <div id="sidebar-container"></div>

    <main class="flex-1 flex flex-col h-screen overflow-hidden">
        <!-- Komponen Header Atas -->
        <div id="header-container"></div>

        <!-- Konten Utama -->
        <div class="flex-1 overflow-y-auto p-6">
            <div class="max-w-5xl mx-auto">
                
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 md:p-8">
                    <h2 class="text-xl font-bold text-gray-800 mb-6 border-b pb-4">Input Jurnal Umum</h2>
                    
                    <form id="formInputJurnal" class="space-y-6">
                        <!-- Informasi Jurnal Dasar -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Tanggal Transaksi</label>
                                <input type="date" id="tglJurnal" required class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-600 outline-none transition-all">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Nomor Referensi (Opsional)</label>
                                <input type="text" id="refJurnal" placeholder="Contoh: INV-2026/08/01" class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-600 outline-none transition-all">
                            </div>
                            <div class="md:col-span-2">
                                <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Keterangan Jurnal</label>
                                <input type="text" id="ketJurnal" required placeholder="Contoh: Pembayaran biaya listrik bulan Agustus" class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-600 outline-none transition-all">
                            </div>
                        </div>

                        <!-- Area Baris Jurnal Dinamis -->
                        <div class="mt-8">
                            <label class="block text-xs font-bold text-gray-500 uppercase mb-3">Detail Akun (Debit & Kredit)</label>
                            
                            <div class="overflow-x-auto rounded-lg border border-gray-200">
                                <table class="w-full text-sm text-left text-gray-600">
                                    <thead class="text-xs text-gray-700 uppercase bg-gray-50 border-b border-gray-200">
                                        <tr>
                                            <th class="px-4 py-3 w-5/12">Kode & Nama Akun (COA)</th>
                                            <th class="px-4 py-3 w-3/12">Debit (Rp)</th>
                                            <th class="px-4 py-3 w-3/12">Kredit (Rp)</th>
                                            <th class="px-4 py-3 w-1/12 text-center">Aksi</th>
                                        </tr>
                                    </thead>
                                    <tbody id="tbodyJurnal" class="divide-y divide-gray-100">
                                        <!-- Baris akan dimasukkan oleh JS -->
                                    </tbody>
                                </table>
                            </div>
                            
                            <!-- Tombol Tambah Baris -->
                            <div class="mt-3">
                                <button type="button" id="btnTambahBaris" class="text-sm font-semibold text-indigo-600 hover:text-indigo-800 flex items-center gap-1">
                                    <span>+ Tambah Baris Akun</span>
                                </button>
                            </div>
                        </div>

                        <!-- Ringkasan Total & Validasi Keseimbangan -->
                        <div class="flex flex-col items-end justify-end border-t pt-6 mt-6">
                            <div class="w-full md:w-1/2 lg:w-1/3 bg-gray-50 rounded-xl p-4 border border-gray-100">
                                <div class="flex justify-between mb-2">
                                    <span class="font-medium text-gray-600">Total Debit:</span>
                                    <span id="totalDebitView" class="font-bold text-gray-900">Rp 0</span>
                                </div>
                                <div class="flex justify-between mb-3">
                                    <span class="font-medium text-gray-600">Total Kredit:</span>
                                    <span id="totalKreditView" class="font-bold text-gray-900">Rp 0</span>
                                </div>
                                <div id="statusBalance" class="text-xs font-bold text-center py-2 rounded bg-gray-200 text-gray-600">
                                    Menunggu Input...
                                </div>
                            </div>
                        </div>

                        <div class="flex justify-end pt-4">
                            <button type="submit" id="btnSimpanJurnal" disabled class="bg-indigo-600 hover:bg-indigo-700 disabled:bg-gray-400 text-white font-bold py-3 px-8 rounded-xl transition-all shadow-sm">
                                Simpan Jurnal
                            </button>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </main>

    <!-- Skrip Aplikasi -->
    <script type="module" src="js/component.js"></script>
    <script type="module" src="js/journal-page.js"></script>
</body>
</html>
