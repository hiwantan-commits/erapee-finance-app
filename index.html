<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Transaksi | PT ERAPEE</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- File CSS Terpusat -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="text-gray-800">
    <div class="flex h-screen overflow-hidden">
        
        <!-- SIDEBAR DINAMIS -->
        <div id="sidebar-container"></div>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col overflow-y-auto md:ml-64">
            
            <!-- HEADER DINAMIS -->
            <div id="header-container"></div>

            <main class="p-4 md:p-8 max-w-4xl mx-auto w-full">
                <div class="dashboard-card p-6 md:p-8">
                    <form id="formTransaksi" class="space-y-5">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                            <div>
                                <label class="block text-sm font-medium mb-1">Tanggal</label>
                                <input type="date" id="tanggal" class="w-full border border-gray-300 rounded-lg px-4 py-2 outline-none focus:ring-2 focus:ring-indigo-500" required>
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-1">No. Referensi</label>
                                <input type="text" id="no_ref" placeholder="INV-2026-001" class="w-full border border-gray-300 rounded-lg px-4 py-2 outline-none focus:ring-2 focus:ring-indigo-500" required>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                            <div>
                                <label class="block text-sm font-medium mb-1">Tipe Arus</label>
                                <select id="tipe" class="w-full border border-gray-300 rounded-lg px-4 py-2 outline-none">
                                    <option value="Masuk">Uang Masuk (Pendapatan)</option>
                                    <option value="Keluar">Uang Keluar (Biaya)</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-1">Kategori Akun</label>
                                <select id="kategori" class="w-full border border-gray-300 rounded-lg px-4 py-2 outline-none">
                                    <option value="Pendapatan IT & Software">Pendapatan IT & Software</option>
                                    <option value="Pendapatan Pertanian">Pendapatan Pertanian (Cabai, Tebu, Buah)</option>
                                    <option value="Beban Gaji">Beban Gaji & Tunjangan</option>
                                    <option value="Beban Sewa & Operasional">Beban Sewa & Operasional</option>
                                </select>
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-medium mb-1">Uraian Transaksi</label>
                            <input type="text" id="uraian" placeholder="Penjelasan singkat..." class="w-full border border-gray-300 rounded-lg px-4 py-2 outline-none focus:ring-2 focus:ring-indigo-500" required>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 pt-4 border-t border-gray-100">
                            <div>
                                <label class="block text-sm font-medium mb-1">Nilai DPP (Rp)</label>
                                <input type="number" id="dpp" value="0" class="w-full border border-gray-300 rounded-lg px-4 py-2 outline-none">
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-1">PPN (Rp)</label>
                                <input type="number" id="ppn" value="0" class="w-full border border-gray-300 rounded-lg px-4 py-2 outline-none">
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-1">Pot. PPh (Rp)</label>
                                <input type="number" id="pph" value="0" class="w-full border border-gray-300 rounded-lg px-4 py-2 outline-none">
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-1">Total Bersih</label>
                                <input type="number" id="total" value="0" class="w-full border border-gray-300 bg-gray-50 rounded-lg px-4 py-2 outline-none" readonly>
                            </div>
                        </div>

                        <div class="pt-6">
                            <button type="submit" id="btnSubmit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 px-4 rounded-lg transition duration-200">
                                Simpan Transaksi
                            </button>
                        </div>
                        <div id="alertSuccess" class="hidden mt-4 p-3 bg-green-50 text-green-700 rounded-lg text-sm text-center font-medium">
                            ✓ Transaksi berhasil dikirim ke Google Sheets
                        </div>
                    </form>
                </div>
            </main>
        </div>
    </div>

    <!-- Skrip Utama -->
    <script src="js/config.js"></script>
    <script src="js/component.js"></script>
    <script src="js/api.js"></script>
</body>
</html>
