<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histori Audit & Jejak Aktivitas | PT ERAPEE Anugrah Sejahtera</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <style>body.auth-pending { visibility: hidden; }</style>
</head>
<body class="text-gray-800 bg-gray-50 auth-pending">
    <div class="flex h-screen overflow-hidden">
        <!-- SIDEBAR -->
        <div id="sidebar-container"></div>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col min-h-0 overflow-y-auto md:ml-64">
            <div id="header-container"></div>

            <main class="p-4 md:p-8 max-w-7xl mx-auto w-full">
                <!-- Header Histori -->
                <div class="dashboard-card p-6 md:p-8 bg-white rounded-2xl shadow-sm mb-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                    <div>
                        <h2 class="text-xl font-bold text-gray-800">Histori Audit & Jejak Aktivitas (Audit Trail)</h2>
                        <p class="text-xs text-gray-500 mt-0.5">Catatan waktu, pengguna, dan perubahan transaksi sistem secara transparan</p>
                    </div>
                </div>

                <!-- Kotak Pencarian & Filter -->
                <div class="dashboard-card p-4 md:p-6 bg-white rounded-2xl shadow-sm mb-6 space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-gray-700 mb-1">Cari (ID Jurnal / Keterangan / Pengguna)</label>
                            <input type="text" id="inputPencarianHistori" onkeyup="window.filterHistori()" placeholder="Ketik kata kunci pencarian..." class="form-input-custom text-xs">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-700 mb-1">Jenis Aksi</label>
                            <select id="filterAksiHistori" onchange="window.filterHistori()" class="form-input-custom text-xs">
                                <option value="SEMUA">Semua Aksi</option>
                                <option value="CREATE">Dibuat (Create)</option>
                                <option value="UPDATE">Diubah (Update)</option>
                                <option value="DELETE">Dihapus (Delete)</option>
                            </select>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-gray-700 mb-1">Dari Tanggal</label>
                            <input type="date" id="filterTanggalDariHistori" onchange="window.filterHistori()" class="form-input-custom text-xs">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-700 mb-1">Sampai Tanggal</label>
                            <input type="date" id="filterTanggalSampaiHistori" onchange="window.filterHistori()" class="form-input-custom text-xs">
                        </div>
                    </div>
                </div>

                <!-- Tabel Log Aktivitas -->
                <div class="dashboard-card p-6 bg-white rounded-2xl shadow-sm">
                    <h3 class="font-bold text-gray-800 text-base mb-4">Log Aktivitas Sistem</h3>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm border-collapse">
                            <thead>
                                <tr class="bg-gray-50 text-gray-500 text-xs uppercase border-b">
                                    <th class="p-3">Waktu (Timestamp)</th>
                                    <th class="p-3">Aksi</th>
                                    <th class="p-3">ID Jurnal</th>
                                    <th class="p-3">Detail & Pengguna</th>
                                </tr>
                            </thead>
                            <tbody id="tabelHistori" class="divide-y divide-gray-100 text-xs">
                                <tr>
                                    <td colspan="4" class="p-8 text-center text-gray-400">Memuat jejak audit aktivitas...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Panggil Modular Controller & Komponen Global -->
    <script type="module" src="js/history-page.js"></script>
    <script type="module" src="js/component.js"></script>
</body>
</html>
