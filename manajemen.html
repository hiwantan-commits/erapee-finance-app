<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Jurnal | PT ERAPEE Anugrah Sejahtera</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="text-gray-800 bg-gray-50">
    <div class="flex h-screen overflow-hidden">
        <!-- SIDEBAR -->
        <div id="sidebar-container"></div>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col overflow-y-auto md:ml-64">
            <div id="header-container"></div>

            <main class="p-4 md:p-8 max-w-7xl mx-auto w-full">
                <!-- Header Manajemen -->
                <div class="dashboard-card p-6 md:p-8 bg-white rounded-2xl shadow-sm mb-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                    <div>
                        <h2 class="text-xl font-bold text-gray-800">Manajemen Jurnal & Buku Besar</h2>
                        <p class="text-xs text-gray-500 mt-0.5">Terhubung ke pusat data tunggal perusahaan</p>
                    </div>
                    <div class="flex flex-wrap gap-3">
                        <!-- Perhatikan pemanggilan window.eksporKeExcel() di sini -->
                        <button onclick="window.eksporKeExcel()" class="bg-green-600 hover:bg-green-700 text-white text-sm font-medium px-4 py-2.5 rounded-xl transition shadow-sm flex items-center gap-2">
                            📥 Ekspor Excel
                        </button>
                        <a href="/input-jurnal" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-4 py-2.5 rounded-xl transition shadow-sm">
                            ➕ Buat Jurnal Baru
                        </a>
                    </div>
                </div>

                <!-- Kotak Pencarian & Filter -->
                <div class="dashboard-card p-4 md:p-6 bg-white rounded-2xl shadow-sm mb-6 grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">Cari Transaksi (No. Bukti / Keterangan / Vendor)</label>
                        <input type="text" id="inputPencarian" onkeyup="window.filterTabelJurnal()" placeholder="Ketik kata kunci pencarian..." class="form-input-custom text-xs">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">Filter Berdasarkan Unit Usaha</label>
                        <select id="filterUnit" onchange="window.filterTabelJurnal()" class="form-input-custom text-xs">
                            <option value="ALL">Semua Unit Usaha</option>
                        </select>
                    </div>
                </div>

                <!-- Tabel Jurnal Interaktif -->
                <div class="dashboard-card p-6 bg-white rounded-2xl shadow-sm">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm border-collapse">
                            <thead>
                                <tr class="bg-gray-50 text-gray-500 text-xs uppercase border-b">
                                    <th class="p-3">ID Jurnal & Tanggal</th>
                                    <th class="p-3">Unit Usaha & No. Bukti</th>
                                    <th class="p-3">Keterangan / Lawan Transaksi</th>
                                    <th class="p-3 text-right">Total Transaksi (Rp)</th>
                                    <th class="p-3 text-center">Status</th>
                                    <th class="p-3 text-center">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="tabelManajemenJurnal" class="divide-y divide-gray-100 text-xs">
                                <tr>
                                    <td colspan="6" class="p-8 text-center text-gray-400">Memuat data dari pusat database...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Panggil Modular Controller & Komponen Global -->
    <script type="module" src="js/management-page.js"></script>
    <script type="module" src="js/component.js"></script>
</body>
</html>
