<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Jurnal | PT ERAPEE Anugrah Sejahtera</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="text-gray-800 bg-gray-50">
    <div class="flex h-screen overflow-hidden">
        <!-- SIDEBAR -->
        <div id="sidebar-container"></div>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col overflow-y-auto md:ml-64">
            <div id="header-container"></div>

            <main class="p-4 md:p-8 max-w-7xl mx-auto w-full">
                <!-- Header Manajemen -->
                <div class="dashboard-card p-6 md:p-8 bg-white rounded-2xl shadow-sm mb-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                    <div>
                        <h2 class="text-xl font-bold text-gray-800">Manajemen Jurnal & Buku Besar</h2>
                        <p class="text-xs text-gray-500 mt-0.5">Draf, riwayat, dan verifikasi posting jurnal akuntansi</p>
                    </div>
                    <div class="flex gap-3">
                        <a href="input-jurnal.html" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-4 py-2.5 rounded-xl transition shadow-sm">
                            + Buat Jurnal Baru
                        </a>
                    </div>
                </div>

                <!-- Tabel Jurnal Interaktif -->
                <div class="dashboard-card p-6 bg-white rounded-2xl shadow-sm">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm border-collapse">
                            <thead>
                                <tr class="bg-gray-50 text-gray-500 text-xs uppercase border-b">
                                    <th class="p-3">Tanggal / Bukti</th>
                                    <th class="p-3">Unit Usaha</th>
                                    <th class="p-3">Akun & Keterangan</th>
                                    <th class="p-3 text-right">Debit (Rp)</th>
                                    <th class="p-3 text-right">Kredit (Rp)</th>
                                    <th class="p-3 text-center">Status</th>
                                    <th class="p-3 text-center">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="tabelManajemenJurnal" class="divide-y divide-gray-100 text-xs">
                                <tr>
                                    <td colspan="7" class="p-8 text-center text-gray-400">Memuat data transaksi dari Firebase Firestore...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Skrip Firebase untuk Manajemen Jurnal -->
    <script type="module">
        import { CONFIG, db } from "./js/config.js";
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { collection, getDocs, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        async function muatManajemenJurnal() {
            const tbody = document.getElementById('tabelManajemenJurnal');
            tbody.innerHTML = `<tr><td colspan="7" class="p-8 text-center text-gray-400">Memuat data transaksi...</td></tr>`;

            try {
                const querySnapshot = await getDocs(collection(db, CONFIG.COLLECTION_NAME));
                tbody.innerHTML = '';

                if (querySnapshot.empty) {
                    tbody.innerHTML = `<tr><td colspan="7" class="p-8 text-center text-gray-400">Belum ada transaksi jurnal tercatat. Silakan buat melalui menu <b>Input Jurnal</b>.</td></tr>`;
                    return;
                }

                let listJurnal = [];
                querySnapshot.forEach((docSnap) => {
                    listJurnal.push({ id: docSnap.id, ...docSnap.data() });
                });

                // Urutkan berdasarkan tanggal terbaru
                listJurnal.sort((a, b) => new Date(b.tanggal) - new Date(a.tanggal));

                listJurnal.forEach((jurnal) => {
                    let tr = document.createElement('tr');
                    let badgeStatus = jurnal.status === 'POSTED' 
                        ? '<span class="px-2 py-0.5 bg-green-100 text-green-700 rounded font-semibold">POSTED</span>' 
                        : '<span class="px-2 py-0.5 bg-amber-100 text-amber-800 rounded font-semibold">DRAFT</span>';

                    tr.innerHTML = `
                        <td class="p-3 font-medium text-gray-800">
                            <div>${jurnal.tanggal || '-'}</div>
                            <div class="text-xs text-gray-400 font-mono">${jurnal.no_bukti || '-'}</div>
                        </td>
                        <td class="p-3 text-gray-600">${jurnal.unit_usaha || '-'}</td>
                        <td class="p-3">
                            <div class="font-semibold text-indigo-600">${jurnal.nama_akun || jurnal.kode_akun || '-'}</div>
                            <div class="text-gray-500 truncate max-w-xs">${jurnal.keterangan || '-'}</div>
                        </td>
                        <td class="p-3 text-right font-semibold text-green-700">${Number(jurnal.debit || 0).toLocaleString('id-ID')}</td>
                        <td class="p-3 text-right font-semibold text-red-700">${Number(jurnal.kredit || 0).toLocaleString('id-ID')}</td>
                        <td class="p-3 text-center">${badgeStatus}</td>
                        <td class="p-3 text-center">
                            <button onclick="hapusJurnal('${jurnal.id}')" class="text-red-600 hover:underline font-semibold text-xs">Hapus</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error("Gagal memuat manajemen jurnal:", err);
                tbody.innerHTML = `<tr><td colspan="7" class="p-8 text-center text-red-500">Gagal memuat data dari database.</td></tr>`;
            }
        }

        window.hapusJurnal = async function(id) {
            if (confirm("Apakah Anda yakin ingin menghapus catatan jurnal ini?")) {
                try {
                    await deleteDoc(doc(db, CONFIG.COLLECTION_NAME, id));
                    alert("Jurnal berhasil dihapus!");
                    muatManajemenJurnal();
                } catch (error) {
                    console.error("Gagal menghapus:", error);
                    alert("Gagal menghapus jurnal: " + error.message);
                }
            }
        };

        muatManajemenJurnal();
    </script>
    <script type="module" src="js/component.js"></script>
</body>
</html>
