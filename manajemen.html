<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Jurnal | PT ERAPEE</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- File CSS Terpusat -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="text-gray-800">
    <div class="flex h-screen overflow-hidden">
        
        <!-- SIDEBAR DINAMIS -->
        <div id="sidebar-container"></div>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col overflow-y-auto md:ml-64">
            
            <!-- HEADER DINAMIS -->
            <div id="header-container"></div>

            <main class="p-4 md:p-8 max-w-7xl mx-auto w-full">
                <div class="dashboard-card overflow-hidden">
                    <div class="p-6 border-b border-gray-100 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                        <div>
                            <h2 class="font-semibold text-lg text-gray-800">Daftar Seluruh Jurnal Akuntansi</h2>
                            <p class="text-xs text-gray-500 mt-0.5">Sinkronisasi langsung dari database Firebase Firestore</p>
                        </div>
                        <button onclick="muatDataManajemen()" class="text-sm bg-gray-100 hover:bg-gray-200 px-4 py-2 rounded-lg font-medium transition">Muat Ulang Data</button>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="border-b bg-gray-50 text-gray-500 text-xs uppercase tracking-wider">
                                    <th class="p-4">Tanggal</th>
                                    <th class="p-4">No Bukti</th>
                                    <th class="p-4">Unit Usaha</th>
                                    <th class="p-4">Akun & Keterangan</th>
                                    <th class="p-4 text-right">Debit (Rp)</th>
                                    <th class="p-4 text-right">Kredit (Rp)</th>
                                    <th class="p-4 text-center">Status</th>
                                    <th class="p-4 text-center">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="tabelManajemen" class="divide-y divide-gray-100 text-sm">
                                <tr>
                                    <td colspan="8" class="p-8 text-center text-gray-400">Menghubungkan ke Firebase Firestore...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Modal Edit Jurnal -->
    <div id="modalEdit" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl max-w-lg w-full p-6 shadow-xl">
            <h3 class="text-lg font-semibold mb-4 text-gray-800">Edit Jurnal Akuntansi</h3>
            <form id="formEdit" class="space-y-4">
                <input type="hidden" id="editId">
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Keterangan / Uraian</label>
                    <input type="text" id="editKeterangan" class="form-input-custom" required>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">Debit (Rp)</label>
                        <input type="number" id="editDebit" class="form-input-custom" required>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">Kredit (Rp)</label>
                        <input type="number" id="editKredit" class="form-input-custom" required>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Status Jurnal</label>
                    <select id="editStatus" class="form-input-custom font-semibold">
                        <option value="POSTED">POSTED</option>
                        <option value="DRAFT">DRAFT</option>
                    </select>
                </div>
                <div class="flex justify-end space-x-3 pt-4 border-t">
                    <button type="button" onclick="tutupModal()" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-sm rounded-lg font-medium">Batal</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm rounded-lg font-medium">Simpan Perubahan</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Skrip Utama (Menggunakan ES Module untuk Firebase) -->
    <script type="module">
        import { CONFIG, db } from "./js/config.js";
        import { collection, getDocs, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        window.muatDataManajemen = async function() {
            const tbody = document.getElementById('tabelManajemen');
            tbody.innerHTML = `<tr><td colspan="8" class="p-8 text-center text-gray-400">Mengambil data dari Firebase...</td></tr>`;

            try {
                const querySnapshot = await getDocs(collection(db, CONFIG.COLLECTION_NAME));
                tbody.innerHTML = '';

                if (querySnapshot.empty) {
                    tbody.innerHTML = `<tr><td colspan="8" class="p-8 text-center text-gray-400">Belum ada jurnal tercatat dalam database.</td></tr>`;
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const docId = docSnap.id;

                    let tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="p-4 whitespace-nowrap">${data.tanggal || '-'}</td>
                        <td class="p-4 font-mono text-xs font-semibold">${data.no_bukti || '-'}</td>
                        <td class="p-4 text-xs text-gray-600">${data.unit_usaha || '-'}</td>
                        <td class="p-4">
                            <div class="font-medium text-gray-800">${data.kode_akun || ''}</div>
                            <div class="text-xs text-gray-500">${data.keterangan || ''}</div>
                        </td>
                        <td class="p-4 text-right font-medium text-green-700">Rp ${(data.debit || 0).toLocaleString('id-ID')}</td>
                        <td class="p-4 text-right font-medium text-red-700">Rp ${(data.kredit || 0).toLocaleString('id-ID')}</td>
                        <td class="p-4 text-center">
                            <span class="px-2.5 py-1 text-xs rounded-full font-semibold ${data.status === 'POSTED' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'}">${data.status || 'DRAFT'}</span>
                        </td>
                        <td class="p-4 text-center space-x-2 whitespace-nowrap">
                            <button onclick='bukaEdit("${docId}", ${JSON.stringify(data).replace(/'/g, "&#39;")})' class="text-indigo-600 hover:underline font-medium text-xs">Edit</button>
                            <button onclick='hapusData("${docId}", "${data.no_bukti}")' class="text-red-600 hover:underline font-medium text-xs">Hapus</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error("Gagal memuat data:", err);
                tbody.innerHTML = `<tr><td colspan="8" class="p-8 text-center text-red-500">Gagal terhubung ke Firebase Firestore. Periksa konfigurasi Anda.</td></tr>`;
            }
        };

        window.hapusData = async function(docId, noBukti) {
            if (confirm(`Apakah Anda yakin ingin menghapus jurnal dengan bukti: ${noBukti}?`)) {
                try {
                    await deleteDoc(doc(db, CONFIG.COLLECTION_NAME, docId));
                    alert('Jurnal berhasil dihapus!');
                    muatDataManajemen();
                } catch (error) {
                    console.error("Gagal menghapus:", error);
                    alert("Gagal menghapus data.");
                }
            }
        };

        window.bukaEdit = function(docId, data) {
            document.getElementById('editId').value = docId;
            document.getElementById('editKeterangan').value = data.keterangan || '';
            document.getElementById('editDebit').value = data.debit || 0;
            document.getElementById('editKredit').value = data.kredit || 0;
            document.getElementById('editStatus').value = data.status || 'POSTED';
            document.getElementById('modalEdit').classList.remove('hidden');
        };

        window.tutupModal = function() {
            document.getElementById('modalEdit').classList.add('hidden');
        };

        document.getElementById('formEdit').addEventListener('submit', async function(e) {
            e.preventDefault();
            const docId = document.getElementById('editId').value;
            
            try {
                const docRef = doc(db, CONFIG.COLLECTION_NAME, docId);
                await updateDoc(docRef, {
                    keterangan: document.getElementById('editKeterangan').value,
                    debit: parseFloat(document.getElementById('editDebit').value) || 0,
                    kredit: parseFloat(document.getElementById('editKredit').value) || 0,
                    status: document.getElementById('editStatus').value
                });

                tutupModal();
                alert('Perubahan jurnal berhasil disimpan!');
                muatDataManajemen();
            } catch (error) {
                console.error("Gagal memperbarui:", error);
                alert("Gagal menyimpan perubahan.");
            }
        });

        // Panggil saat halaman dimuat
        muatDataManajemen();
    </script>
    <script src="js/component.js"></script>
</body>
</html>
