<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk Sesi | PT ERAPEE Anugrah Sejahtera</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50 text-gray-800 flex items-center justify-center h-screen">
    <div class="max-w-md w-full mx-4">
        <div class="dashboard-card p-8 bg-white rounded-2xl shadow-sm border border-gray-100">
            
            <!-- Header Kartu Login -->
            <div class="text-center mb-8">
                <h1 class="text-2xl font-bold text-gray-900 tracking-tight">PT ERAPEE</h1>
                <p class="text-xs text-gray-500 mt-1">Anugrah Sejahtera — Sistem Keuangan & Coretax</p>
            </div>

            <!-- Pesan Error Dinamis -->
            <div id="pesanError" class="hidden mb-4 p-3 bg-red-50 text-red-600 text-xs rounded-xl font-medium border border-red-200 text-center"></div>

            <!-- Form Login -->
            <form id="formLogin" class="space-y-5">
                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1.5">Alamat Email Perusahaan</label>
                    <input type="email" id="email" placeholder="admin@erapee.com" class="form-input-custom text-sm" required>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1.5">Kata Sandi (Password)</label>
                    <input type="password" id="password" placeholder="••••••••" class="form-input-custom text-sm" required>
                </div>
                <button type="submit" id="btnSubmit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl text-sm transition shadow-sm">
                    Masuk ke Sistem
                </button>
            </form>

            <div class="mt-6 text-center">
                <p class="text-[11px] text-gray-400">Dilindungi oleh Protokol Keamanan Firebase Authentication</p>
            </div>
        </div>
    </div>

    <!-- Panggil Modular Controller Login -->
    <script type="module" src="js/login-page.js"></script>
</body>
</html>
