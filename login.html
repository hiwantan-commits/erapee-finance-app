<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | PT ERAPEE Anugrah Sejahtera</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50 flex items-center justify-center h-screen">
    <div class="dashboard-card p-8 max-w-md w-full bg-white shadow-lg rounded-xl">
        <div class="text-center mb-6">
            <h1 class="text-xl font-bold text-gray-900">PT ERAPEE ANUGRAH SEJAHTERA</h1>
            <p class="text-xs text-gray-500 mt-1">Sistem Keuangan & Perpajakan Terpadu</p>
        </div>

        <form id="formLogin" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-gray-700 mb-1">Email Perusahaan</label>
                <input type="email" id="emailLogin" placeholder="admin@erapee.com" class="form-input-custom" required>
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-700 mb-1">Kata Sandi</label>
                <input type="password" id="passwordLogin" placeholder="••••••••" class="form-input-custom" required>
            </div>
            <div class="pt-2">
                <button type="submit" id="btnLogin" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-lg text-sm transition">
                    Masuk ke Sistem
                </button>
            </div>
            <div id="errorLogin" class="hidden mt-3 p-3 bg-red-50 text-red-700 rounded-lg text-xs text-center font-medium"></div>
        </form>
    </div>

    <!-- Skrip Firebase Auth -->
    <script type="module">
        import { CONFIG } from "./js/config.js";
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const app = initializeApp(CONFIG.FIREBASE_CONFIG);
        const auth = getAuth(app);

        document.getElementById('formLogin').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('emailLogin').value;
            const password = document.getElementById('passwordLogin').value;
            const errDiv = document.getElementById('errorLogin');
            const btn = document.getElementById('btnLogin');

            btn.innerText = "Memeriksa...";
            btn.disabled = true;
            errDiv.classList.add('hidden');

            try {
                await signInWithEmailAndPassword(auth, email, password);
                // Jika berhasil, arahkan ke halaman utama (index.html)
                window.location.href = 'index.html';
            } catch (error) {
                console.error("Login error:", error);
                errDiv.innerText = "Gagal masuk: Periksa kembali email dan kata sandi Anda.";
                errDiv.classList.remove('hidden');
                btn.innerText = "Masuk ke Sistem";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
