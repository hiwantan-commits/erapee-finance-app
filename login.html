<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | PT ERAPEE Anugrah Sejahtera</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50 flex items-center justify-center h-screen">
    <div class="dashboard-card p-8 max-w-md w-full bg-white shadow-lg rounded-xl">
        <div class="text-center mb-6">
            <h1 class="text-xl font-bold text-gray-900">PT ERAPEE ANUGRAH SEJAHTERA</h1>
            <p class="text-xs text-gray-500 mt-1">Sistem Keuangan & Perpajakan Terpadu</p>
        </div>

        <form id="formLogin" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-gray-700 mb-1">Email Perusahaan</label>
                <input type="email" id="emailLogin" placeholder="admin@erapee.com" class="form-input-custom" required>
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-700 mb-1">Kata Sandi</label>
                <div class="relative">
                    <input type="password" id="passwordLogin" placeholder="••••••••" class="form-input-custom pr-10" required>
                    <!-- Tombol Mata -->
                    <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 focus:outline-none cursor-pointer">
                        <!-- Icon Mata Tertutup (Default) -->
                        <svg id="iconEyeClosed" class="w-5 h-5 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path>
                        </svg>
                        <!-- Icon Mata Terbuka -->
                        <svg id="iconEyeOpen" class="w-5 h-5 hidden pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="pt-2">
                <button type="submit" id="btnLogin" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-lg text-sm transition">
                    Masuk ke Sistem
                </button>
            </div>
            <!-- Kotak Notifikasi Error (Menggunakan style display secara langsung) -->
            <div id="errorLogin" style="display: none;" class="mt-3 p-3 bg-red-50 text-red-700 rounded-lg text-xs text-center font-medium border border-red-200"></div>
        </form>
    </div>

    <!-- Fungsi Global Toggle Password -->
    <script>
        function togglePassword() {
            const inputPassword = document.getElementById('passwordLogin');
            const iconClosed = document.getElementById('iconEyeClosed');
            const iconOpen = document.getElementById('iconEyeOpen');

            if (inputPassword.type === 'password') {
                inputPassword.type = 'text';
                iconClosed.classList.add('hidden');
                iconOpen.classList.remove('hidden');
            } else {
                inputPassword.type = 'password';
                iconOpen.classList.add('hidden');
                iconClosed.classList.remove('hidden');
            }
        }
    </script>

    <!-- Skrip Firebase Auth -->
    <script type="module">
        import { CONFIG } from "./js/config.js";
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const app = initializeApp(CONFIG.FIREBASE_CONFIG);
        const auth = getAuth(app);

        document.getElementById('formLogin').addEventListener('submit', async function(e) {
            e.preventDefault();
            const emailInput = document.getElementById('emailLogin');
            const passwordInput = document.getElementById('passwordLogin');
            const errDiv = document.getElementById('errorLogin');
            const btn = document.getElementById('btnLogin');

            const email = emailInput.value;
            const password = passwordInput.value;

            btn.innerText = "Memeriksa...";
            btn.disabled = true;
            errDiv.style.display = 'none';

            try {
                await signInWithEmailAndPassword(auth, email, password);
                window.location.href = 'index.html';
            } catch (error) {
                console.error("Login error code:", error.code);
                let pesanError = "⚠️ Kata sandi atau email salah. Periksa kembali masukan Anda.";

                if (error.code === 'auth/invalid-email') {
                    pesanError = "⚠️ Format alamat email tidak valid.";
                } else if (error.code === 'auth/too-many-requests') {
                    pesanError = "⚠️ Terlalu banyak percobaan gagal. Silakan coba beberapa saat lagi.";
                }

                // Tampilkan pesan error dan pastikan email tidak terhapus
                errDiv.innerText = pesanError;
                errDiv.style.display = 'block';

                btn.innerText = "Masuk ke Sistem";
                btn.disabled = false;
                passwordInput.value = ''; 
                passwordInput.focus();
            }
        });
    </script>
</body>
</html>
