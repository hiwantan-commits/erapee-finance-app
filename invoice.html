<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Invoice & Kwitansi | PT ERAPEE Anugrah Sejahtera</title>
    <!-- Inisialisasi tema (terpusat di js/tema-*.js, lihat komentar di file
         tersebut - supaya perubahan logika tema cukup di satu tempat) -->
    <script src="js/tema-fouc-init.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/tema-tailwind-config.js"></script>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#D97757">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <script src="js/pwa-register.js"></script>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ERAPEE Finance">
    <link rel="stylesheet" href="css/style.css">
    <style>body.auth-pending { visibility: hidden; }</style>
</head>
<body data-tema="elegant" class="text-stone-900 dark:text-stone-100 bg-stone-50 dark:bg-stone-950 auth-pending">
    <div class="flex h-screen overflow-hidden">
        <!-- SIDEBAR -->
        <div id="sidebar-container"></div>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col min-h-0 overflow-y-auto md:ml-64">
            <div id="header-container"></div>

            <main class="p-4 md:p-8 max-w-7xl mx-auto w-full">
                <!-- Header Invoice (polos di atas latar, tanpa bingkai kartu) -->
                <div class="mb-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                    <div>
                        <h1 class="h-elegant-2 text-stone-900 dark:text-stone-50">Invoice & Kwitansi</h1>
                        <p class="text-sm text-stone-500 dark:text-stone-400 mt-1">Dokumen penjualan berdiri sendiri - tidak tercatat otomatis sebagai jurnal akuntansi</p>
                    </div>
                    <a href="/invoice-baru" id="btnBuatInvoiceBaru" class="btn-elegant-primary">+ Buat Invoice Baru</a>
                </div>

                <!-- Kotak Pencarian -->
                <div class="bg-white dark:bg-stone-900 border border-stone-200/70 dark:border-stone-800 rounded-2xl p-4 md:p-6 shadow-sm mb-6">
                    <label class="block text-xs font-medium text-stone-600 dark:text-stone-300 mb-1">Cari (No. Invoice / Nama Pelanggan)</label>
                    <input type="text" id="inputPencarianInvoice" onkeyup="window.filterTabelInvoice()" placeholder="Ketik kata kunci pencarian..." class="form-input-elegant text-xs">
                </div>

                <!-- Tabel Daftar Invoice -->
                <div id="kartuTabelInvoice" class="bg-white dark:bg-stone-900 border border-stone-200/70 dark:border-stone-800 rounded-2xl p-6 shadow-sm">
                    <div class="hidden md:block overflow-x-auto">
                        <table class="w-full text-left text-sm border-collapse">
                            <thead>
                                <tr class="text-stone-400 dark:text-stone-500 text-xs normal-case tracking-normal border-b border-stone-100 dark:border-stone-800">
                                    <th class="p-3 font-medium">No. Invoice</th>
                                    <th class="p-3 font-medium">Tanggal</th>
                                    <th class="p-3 font-medium">Pelanggan</th>
                                    <th class="p-3 text-right font-medium">Grand Total (Rp)</th>
                                    <th class="p-3 w-16 text-center font-medium">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="tabelInvoice" class="divide-y divide-stone-100 dark:divide-stone-800 text-xs">
                                <tr>
                                    <td colspan="5" class="p-8 text-center text-stone-400 dark:text-stone-500">Memuat daftar invoice...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Tampilan kartu untuk layar sempit -->
                    <div id="kartuMobileInvoice" class="md:hidden space-y-3">
                        <p class="p-8 text-center text-stone-400 dark:text-stone-500 text-sm">Memuat daftar invoice...</p>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Panggil Modular Controller & Komponen Global -->
    <script type="module" src="js/invoice-list-page.js"></script>
    <script type="module" src="js/component.js"></script>
</body>
</html>
