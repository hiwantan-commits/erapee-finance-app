<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Laba Rugi | PT ERAPEE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; background-color: #F9FAFB; }</style>
</head>
<body class="text-gray-800">
    <div class="flex h-screen overflow-hidden">
        
        <!-- SIDEBAR DINAMIS -->
        <div id="sidebar-container"></div>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col overflow-y-auto md:ml-64">
            <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-6">
                <h1 class="text-xl font-semibold">Laporan Laba Rugi (Real-Time Cloud)</h1>
                <button onclick="muatDataLaporan()" class="text-sm bg-gray-100 hover:bg-gray-200 px-4 py-2 rounded-lg font-medium transition">Muat Ulang</button>
            </header>
            
            <main class="p-6 md:p-8 max-w-5xl mx-auto w-full">
                <!-- Ringkasan Kartu -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                    <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
                        <p class="text-sm text-gray-500 font-medium">Total Pendapatan (Bruto)</p>
                        <h3 id="lblPendapatan" class="text-2xl font-bold text-green-600 mt-2">Rp 0</h3>
                    </div>
                    <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
                        <p class="text-sm text-gray-500 font-medium">Total Beban / Pengeluaran</p>
                        <h3 id="lblBeban" class="text-2xl font-bold text-red-600 mt-2">Rp 0</h3>
                    </div>
                    <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
                        <p class="text-sm text-gray-500 font-medium">Estimasi Laba Bersih</p>
                        <h3 id="lblLaba" class="text-2xl font-bold text-indigo-600 mt-2">Rp 0</h3>
                    </div>
                </div>

                <!-- Tabel Data Sumber -->
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <div class="p-6 border-b border-gray-100">
                        <h2 class="font-semibold text-lg">Draf Rekapitulasi Transaksi Terhubung</h2>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-gray-50 text-gray-500 text-xs uppercase tracking-wider border-b">
                                    <th class="p-4">Tanggal</th>
                                    <th class="p-4">Kategori</th>
                                    <th class="p-4">Uraian</th>
                                    <th class="p-4 text-right">DPP (Rp)</th>
                                    <th class="p-4 text-right">Total (Rp)</th>
                                </tr>
                            </thead>
                            <tbody id="tabelTransaksi" class="divide-y divide-gray-100 text-sm">
                                <tr>
                                    <td colspan="5" class="p-6 text-center text-gray-400">Menghubungkan ke Google Sheets...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Panggil Config Pusat, Navigasi Dinamis, dan Logika Laporan -->
    <script src="js/config.js"></script>
    <script src="js/component.js"></script>
    <script>
        function muatDataLaporan() {
            document.getElementById('tabelTransaksi').innerHTML = `<tr><td colspan="5" class="p-6 text-center text-gray-400">Mengambil data terbaru...</td></tr>`;
            
            // Mengambil SPREADSHEET_ID dan SHEET_NAME secara otomatis dari CONFIG pusat
            const url = `https://docs.google.com/spreadsheets/d/${CONFIG.SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(CONFIG.SHEET_NAME)}`;

            fetch(url)
                .then(res => res.text())
                .then(text => {
                    const jsonString = text.substring(47).slice(0, -2);
                    const json = JSON.parse(jsonString);
                    const rows = json.table.rows;
                    
                    const tbody = document.getElementById('tabelTransaksi');
                    tbody.innerHTML = '';
                    
                    let totalPendapatan = 0;
                    let totalBeban = 0;

                    if (!rows || rows.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-gray-400">Belum ada data transaksi tercatat.</td></tr>`;
                        return;
                    }

                    rows.forEach(r => {
                        const c = r.c;
                        if (!c[0] || !c[2]) return;

                        let tanggal = c[0] ? (c[0].f || c[0].v) : '';
                        let tipe = c[2] ? c[2].v : '';
                        let kategori = c[3] ? c[3].v : '';
                        let uraian = c[4] ? c[4].v : '';
                        let dpp = c[5] ? (parseFloat(c[5].v) || 0) : 0;
                        let total = c[8] ? (parseFloat(c[8].v) || 0) : 0;

                        if (tipe === "Masuk") {
                            totalPendapatan += dpp;
                        } else {
                            totalBeban += dpp;
                        }

                        let tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td class="p-4">${tanggal}</td>
                            <td class="p-4 font-medium">${kategori}</td>
                            <td class="p-4 text-gray-500">${uraian}</td>
                            <td class="p-4 text-right">Rp ${dpp.toLocaleString('id-ID')}</td>
                            <td class="p-4 text-right font-semibold">Rp ${total.toLocaleString('id-ID')}</td>
                        `;
                        tbody.appendChild(tr);
                    });

                    document.getElementById('lblPendapatan').innerText = `Rp ${totalPendapatan.toLocaleString('id-ID')}`;
                    document.getElementById('lblBeban').innerText = `Rp ${totalBeban.toLocaleString('id-ID')}`;
                    document.getElementById('lblLaba').innerText = `Rp ${(totalPendapatan - totalBeban).toLocaleString('id-ID')}`;
                })
                .catch(err => {
                    console.error('Error:', err);
                    document.getElementById('tabelTransaksi').innerHTML = `<tr><td colspan="5" class="p-6 text-center text-red-500">Gagal memuat data dari Spreadsheet.</td></tr>`;
                });
        }

        muatDataLaporan();
    </script>
</body>
</html>
